<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Drift</title>
    <meta
      name="description"
      content="A piece where typed words become physical objects, given weight and behavior by what they mean."
    />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <!-- The canvas is the whole document, so it is also the whole of the main
         landmark. Without one, assistive technology has no way to skip to the
         content, and Lighthouse's accessibility audit fails on it. -->
    <main>
      <canvas
        id="room"
        aria-label="Drift: a room where typed words fall and settle as physical objects."
      ></canvas>
    </main>
  </body>
</html>
